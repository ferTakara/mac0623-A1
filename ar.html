<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MAC0623 — A4</title>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    html, body {
      background: transparent !important;
    }
  </style>
</head>
<body>

  <!-- Container para WebXR DOM Overlay (obrigatório para AR no Chrome Mobile) -->
  <div id="ar-overlay">
    <div id="hud">
      <label id="participantLabel">Participant <input id="participantId" value="P01" size="4" /></label>
      <label id="mappingLabel">Mapping
        <select id="mappingSelect">
          <option value="1">1 — baseline: touch gestures</option>
          <option value="2">2 — raycast + phone motion</option>
        </select>
      </label>
      <button id="confirmBtn">Confirm (Enter)</button>
      <button id="downloadBtn">Download CSV</button>
      <span id="status">—</span>
    </div>

    <!-- Botão inferior para fixar o workspace e iniciar a atividade -->
    <button id="startActivityBtn">Iniciar atividade</button>

    <div id="help">
      Toque para selecionar. 1 dedo arrasta, 2 dedos giram. Toque fora ou no botão para deselecionar. Confirm registra o trial.
    </div>

    <!-- Modal de Fadiga de Braço no fim do experimento (substituto limpo de prompt/alert) -->
    <div id="fatigueModal" class="hidden">
      <span>Fim da Técnica 1! Quão cansados estão seus braços?</span>
      <div id="fatigueButtons">
        <button data-rating="1">1 (Mínimo)</button>
        <button data-rating="2">2</button>
        <button data-rating="3">3</button>
        <button data-rating="4">4</button>
        <button data-rating="5">5 (Extremo)</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/ar.js"></script>
</body>
</html>
