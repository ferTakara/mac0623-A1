<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAC0623 — A4</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- Container para WebXR DOM Overlay (obrigatório para AR no Chrome Mobile) -->
  <div id="ar-overlay">
    <div id="hud">
      <label>Participant <input id="participantId" value="P01" size="4" /></label>
      <label id="mappingLabel">Mapping
        <select id="mappingSelect">
          <option value="1">1 — baseline: touch gestures</option>
          <option value="2">2 — your own</option>
        </select>
      </label>
      <span id="trialCount">Trial 1</span>
      <button id="confirmBtn">Confirm (Enter)</button>
      <button id="downloadBtn">Download CSV</button>
      <span id="status">—</span>
    </div>

    <!-- Banner flutuante de instruções para escaneamento e feedback de status -->
    <div id="instructionBanner">Aponte a câmera para uma superfície plana (mesa ou chão) para escanear...</div>

    <div id="help">
      Confirm logs your current error and starts the next trial — it does not
      require being in tolerance first. The status pill turns green as a hint,
      not a gate. See README.md.
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/ar.js"></script>
</body>
</html>
