<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAC0623 — A2</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- ============================================================
       HUD — provided, same fields as the A1 starter (participant ID,
       mapping select, trial counter, confirm/download) plus a status
       line that also reports VR state once the retrofit is wired.
       Don't remove these IDs; main.js reads them exactly.
       ============================================================ -->
  <div id="hud">
    <label>Participant <input id="participantId" value="P01" size="4" /></label>
    <label>Mapping
      <select id="mappingSelect">
        <option value="1">1 — baseline (mode-switched)</option>
        <option value="2">2 — your own</option>
        <option value="3">3 — VR Direct Grab (6DoF)</option>
        <option value="4">4 — VR Trackball</option>
        <option value="5">5 — VR Gizmo</option>
      </select>
    </label>
    <span id="trialCount">Trial 1</span>
    <button id="confirmBtn">Confirm (Enter)</button>
    <button id="downloadBtn">Download CSV</button>
    <span id="status">—</span>
  </div>

  <div id="help">
    Confirm logs your current error and starts the next trial — it does not
    require being in tolerance first. The status pill turns green as a hint,
    not a gate. See README.md and the STUDENT TODO comments in main.js.
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
